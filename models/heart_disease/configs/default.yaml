# Default configuration for heart disease model

model:
  name: heart_disease_classifier
  type: gradient_boosting
  version: "1.0.0"

training:
  n_estimators: 100
  max_depth: 5
  learning_rate: 0.1
  random_state: 42
  test_size: 0.2

preprocessing:
  scaler_type: "standard"

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc

